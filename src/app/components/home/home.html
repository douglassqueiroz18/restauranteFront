<div class="dashboard-container">
  <header class="welcome-header">
    <h1>Bem-vindo ao Gestor Restaurante</h1>
    <p>Escolha uma opção abaixo para começar</p>
  </header>

  <div class="grid-menu">
    @for (item of menuItems; track item.titulo) {
      <mat-card class="menu-card" (click)="navegar(item.rota)">
        <mat-card-content>
          <div class="icon-circle" [style.background-color]="item.cor">
            <mat-icon>{{ item.icon }}</mat-icon>
          </div>
          <div class="text-content">
            <h3>{{ item.titulo }}</h3>
            <p>{{ item.subtitulo }}</p>
          </div>
        </mat-card-content>
      </mat-card>
    }
  </div>
</div>
