<h2 mat-dialog-title>
  <mat-icon>edit</mat-icon> Editar Insumo: {{ data.nome }}
</h2>

<mat-dialog-content>
  <form [formGroup]="editForm" class="edit-form">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nome do Insumo</mat-label>
      <input matInput formInput formControlName="nome">
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Qtd. em Estoque</mat-label>
        <input matInput type="number" formControlName="quantidadeAtual">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Unidade</mat-label>
        <mat-select formControlName="unidadeMedida">
          <mat-option *ngFor="let un of unidadesMedida" [value]="un.valor">
            {{ un.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Preço Unitário (R$)</mat-label>
        <input matInput type="number" formControlName="precoCusto">
        <span matPrefix>R$&nbsp;</span>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Estoque Mínimo</mat-label>
        <input matInput type="number" formControlName="estoqueSeguranca">
      </mat-form-field>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="salvar()" [disabled]="editForm.invalid">
    <mat-icon>save</mat-icon> Salvar Alterações
  </button>
</mat-dialog-actions>
